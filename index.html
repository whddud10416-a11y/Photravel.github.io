<!DOCTYPE html>
<html lang="en">
<head>
    <title>3D Maze Game</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas { display: block; }
        #progress-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 300px;
            height: 20px;
            border: 1px solid #fff;
            background-color: #555;
        }
        #progress-bar {
            height: 100%;
            width: 0;
            background-color: #fff;
        }
        #overlay-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0s linear 0.5s;
            z-index: 100;
        }
        #overlay-container.visible {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease;
        }
        #overlay-iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0; /* Remove border-radius for fullscreen */
            background: transparent;
        }
        #overlay-close-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            color: black;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 101;
        }
    </style>
</head>
<body>
    <div id="overlay-container">
        <button id="overlay-close-button">&times;</button>
        <iframe id="overlay-iframe" allowtransparency="true"></iframe>
    </div>

    <div id="error-container" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: red; background-color: black; padding: 20px; border: 1px solid red; display: none;">
        <p>An error occurred:</p>
        <pre id="error-message"></pre>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/",
                "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.min.js"
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
