<!DOCTYPE html>
<html lang="en">
<head>
    <title>Photravel</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <style>
        @font-face {
            font-family: 'BookkMyungjo Bold';
            src: url('BookkMyungjo_Bold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas { display: block; }
        #gallery-button {
            position: absolute;
            top: 27px;
            left: 51px;
            font-family: 'BookkMyungjo Bold', 'Pretendard', sans-serif;
            font-weight: 700; /* Bold */
            font-size: 20px;
            color: white;
            text-decoration: none;
            letter-spacing: 0.25em;
            z-index: 10;
            opacity: 0; /* Initially hidden */
            filter: blur(10px); /* Initially blurred */
            transition: opacity 1s ease, filter 1s ease; /* Transition for both */
        }
        #gallery-button.visible {
            opacity: 1;
            filter: blur(0px);
        }
        #progress-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 300px;
            height: 20px;
            border: 1px solid #fff;
            background-color: #555;
        }
        #progress-bar {
            height: 100%;
            width: 0;
            background-color: #fff;
        }
        #overlay-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-in-out, visibility 0s linear 0.3s;
            z-index: 100;
        }
        #overlay-container.visible {
            opacity: 1;
            visibility: visible;
            transition: opacity 1s ease-in-out;
        }
        #overlay-iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0;
            background: transparent;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        #overlay-iframe.loaded {
            opacity: 1;
        }
        #overlay-close-button {
            position: absolute;
            top: 28px;
            right: 20px;
            background: white;
            color: black;
            border: none;
            border-radius: 50%;
            width: 33px;
            height: 33px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 101;
            opacity: 1;
            transition: opacity 1s ease-in-out;
        }
        #overlay-close-button.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <a id="gallery-button" href="#">Gallery</a>
    <div id="overlay-container">
        <iframe id="overlay-iframe" allowtransparency="true"></iframe>
        <button id="overlay-close-button" class="hidden">&times;</button>
    </div>

    <div id="error-container" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: red; background-color: black; padding: 20px; border: 1px solid red; display: none;">
        <p>An error occurred:</p>
        <pre id="error-message"></pre>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/",
                "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.min.js",
                "simplex-noise": "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.1/dist/esm/simplex-noise.js"
            }
        }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
